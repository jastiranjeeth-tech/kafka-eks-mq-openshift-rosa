name: MQHA EKS CI/CD

on:
  push:
    paths:
      - 'MQHA_EKS/**'
      - '.github/workflows/mqha-eks-ci-cd.yml'
  pull_request:
    paths:
      - 'MQHA_EKS/**'
      - '.github/workflows/mqha-eks-ci-cd.yml'
  workflow_dispatch:
    inputs:
      deploy_site:
        description: 'Site to deploy (site-a or site-b)'
        required: true
        default: 'site-a'
        type: choice
        options:
          - site-a
          - site-b
      aws_region:
        description: 'AWS region for target site'
        required: true
        default: 'us-east-1'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'

      - name: Terraform format check
        run: terraform -chdir=MQHA_EKS/terraform fmt -check -recursive

      - name: Terraform init+validate site-a
        run: |
          terraform -chdir=MQHA_EKS/terraform/sites/site-a init -backend=false
          terraform -chdir=MQHA_EKS/terraform/sites/site-a validate

      - name: Terraform init+validate site-b
        run: |
          terraform -chdir=MQHA_EKS/terraform/sites/site-b init -backend=false
          terraform -chdir=MQHA_EKS/terraform/sites/site-b validate

      - name: Terraform init+validate global-dns
        run: |
          terraform -chdir=MQHA_EKS/terraform/global-dns init -backend=false
          terraform -chdir=MQHA_EKS/terraform/global-dns validate

      - name: Validate Kubernetes YAML syntax
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
          yamllint MQHA_EKS/k8s

      - name: Shell script lint
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck MQHA_EKS/scripts/*.sh

  cd_deploy_site:
    if: github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ubuntu-latest
    env:
      SITE: ${{ inputs.deploy_site }}
      AWS_REGION: ${{ inputs.aws_region }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'

      - name: Deploy Terraform for selected site
        run: |
          terraform -chdir=MQHA_EKS/terraform/sites/${SITE} init
          terraform -chdir=MQHA_EKS/terraform/sites/${SITE} apply -auto-approve

      - name: Update kubeconfig
        run: |
          CLUSTER_NAME=$(terraform -chdir=MQHA_EKS/terraform/sites/${SITE} output -raw cluster_name)
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Deploy MQ manifests for selected site
        run: |
          chmod +x MQHA_EKS/scripts/deploy-site-mq-ha.sh
          MQHA_EKS/scripts/deploy-site-mq-ha.sh ${SITE}

      - name: Post-deploy status
        run: |
          kubectl get pods -n ibm-mq
          kubectl get svc -n ibm-mq mq-ha-service
